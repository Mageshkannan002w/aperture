<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" width="700" height="900">
  <defs>
    <linearGradient id="grad_intro-5.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(238, 241, 239)"/>
      <stop offset="100%" stop-color="rgb(212, 216, 214)"/>
    </linearGradient>
    <pattern id="grain_intro-5.svg" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="70" cy="40" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="40" cy="80" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="85" cy="85" r="0.5" fill="rgba(0,0,0,0.04)"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad_intro-5.svg)"/>
  <rect width="100%" height="100%" fill="url(#grain_intro-5.svg)"/>
  
  <!-- Subtle aesthetic camera frame/grid -->
  <line x1="70.0" y1="180.0" x2="630.0" y2="180.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="70.0" y1="720.0" x2="630.0" y2="720.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="210.0" y1="90.0" x2="210.0" y2="810.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="489.99999999999994" y1="90.0" x2="489.99999999999994" y2="810.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  
  <!-- Focal center icon -->
  <circle cx="350.0" cy="414.0" r="98.00000000000001" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
  <circle cx="350.0" cy="414.0" r="49.00000000000001" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
  <circle cx="350.0" cy="414.0" r="3" fill="rgba(255,255,255,0.9)"/>

  <!-- Minimal typography -->
  <text x="350.0" y="648.0" font-family="Inter, -apple-system, sans-serif" font-size="26" font-weight="600" letter-spacing="0.08em" text-anchor="middle" fill="rgba(20, 20, 24, 0.85)" text-transform="uppercase">Silhouette Balance</text>
  <text x="350.0" y="679.0" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="400" letter-spacing="0.04em" text-anchor="middle" fill="rgba(60, 64, 72, 0.7)">Studio Minimalist Contrast</text>
  
  <!-- Technical camera readout mark -->
  <text x="56.0" y="846.0" font-family="monospace" font-size="14" fill="rgba(20,20,24,0.45)">ISO 100 · 50mm · ƒ/1.4</text>
  <text x="644.0" y="846.0" font-family="monospace" font-size="14" text-anchor="end" fill="rgba(20,20,24,0.45)">AR · APERTURE</text>
</svg>