<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="800" height="533">
  <defs>
    <linearGradient id="grad_blog-pricing-strategies.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(236, 240, 238)"/>
      <stop offset="100%" stop-color="rgb(208, 216, 212)"/>
    </linearGradient>
    <pattern id="grain_blog-pricing-strategies.svg" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="70" cy="40" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="40" cy="80" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="85" cy="85" r="0.5" fill="rgba(0,0,0,0.04)"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad_blog-pricing-strategies.svg)"/>
  <rect width="100%" height="100%" fill="url(#grain_blog-pricing-strategies.svg)"/>
  
  <!-- Subtle aesthetic camera frame/grid -->
  <line x1="80.0" y1="106.60000000000001" x2="720.0" y2="106.60000000000001" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="80.0" y1="426.40000000000003" x2="720.0" y2="426.40000000000003" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="240.0" y1="53.300000000000004" x2="240.0" y2="479.7" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="560.0" y1="53.300000000000004" x2="560.0" y2="479.7" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  
  <!-- Focal center icon -->
  <circle cx="400.0" cy="245.18" r="74.62" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
  <circle cx="400.0" cy="245.18" r="37.31" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
  <circle cx="400.0" cy="245.18" r="3" fill="rgba(255,255,255,0.9)"/>

  <!-- Minimal typography -->
  <text x="400.0" y="383.76" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="600" letter-spacing="0.08em" text-anchor="middle" fill="rgba(20, 20, 24, 0.85)" text-transform="uppercase">Pricing Your Photography</text>
  <text x="400.0" y="406.76" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" letter-spacing="0.04em" text-anchor="middle" fill="rgba(60, 64, 72, 0.7)">Strategies That Actually Work</text>
  
  <!-- Technical camera readout mark -->
  <text x="64.0" y="501.02" font-family="monospace" font-size="10" fill="rgba(20,20,24,0.45)">ISO 100 · 50mm · ƒ/1.4</text>
  <text x="736.0" y="501.02" font-family="monospace" font-size="10" text-anchor="end" fill="rgba(20,20,24,0.45)">AR · APERTURE</text>
