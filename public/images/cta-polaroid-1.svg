<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 550" width="450" height="550">
  <defs>
    <linearGradient id="grad_cta-polaroid-1.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(242, 240, 238)"/>
      <stop offset="100%" stop-color="rgb(216, 212, 208)"/>
    </linearGradient>
    <pattern id="grain_cta-polaroid-1.svg" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="70" cy="40" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="40" cy="80" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="85" cy="85" r="0.5" fill="rgba(0,0,0,0.04)"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad_cta-polaroid-1.svg)"/>
  <rect width="100%" height="100%" fill="url(#grain_cta-polaroid-1.svg)"/>
  
  <!-- Subtle aesthetic camera frame/grid -->
  <line x1="45.0" y1="110.0" x2="405.0" y2="110.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="45.0" y1="440.0" x2="405.0" y2="440.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="135.0" y1="55.0" x2="135.0" y2="495.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="315.0" y1="55.0" x2="315.0" y2="495.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  
  <!-- Focal center icon -->
  <circle cx="225.0" cy="253.0" r="63.00000000000001" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
  <circle cx="225.0" cy="253.0" r="31.500000000000004" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
  <circle cx="225.0" cy="253.0" r="3" fill="rgba(255,255,255,0.9)"/>

  <!-- Minimal typography -->
  <text x="225.0" y="396.0" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="600" letter-spacing="0.08em" text-anchor="middle" fill="rgba(20, 20, 24, 0.85)" text-transform="uppercase">Campaign Frame</text>
  <text x="225.0" y="416.0" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="400" letter-spacing="0.04em" text-anchor="middle" fill="rgba(60, 64, 72, 0.7)">Paris Studio Select</text>
  
  <!-- Technical camera readout mark -->
  <text x="36.0" y="517.0" font-family="monospace" font-size="10" fill="rgba(20,20,24,0.45)">ISO 100 · 50mm · ƒ/1.4</text>
  <text x="414.0" y="517.0" font-family="monospace" font-size="10" text-anchor="end" fill="rgba(20,20,24,0.45)">AR · APERTURE</text>
</svg>