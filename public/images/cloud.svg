<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 445" width="816" height="445">
  <defs>
    <linearGradient id="grad_cloud.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(248, 250, 252)"/>
      <stop offset="100%" stop-color="rgb(228, 232, 238)"/>
    </linearGradient>
    <pattern id="grain_cloud.svg" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="70" cy="40" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="40" cy="80" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="85" cy="85" r="0.5" fill="rgba(0,0,0,0.04)"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad_cloud.svg)"/>
  <rect width="100%" height="100%" fill="url(#grain_cloud.svg)"/>
  
  <!-- Subtle aesthetic camera frame/grid -->
  <line x1="81.60000000000001" y1="89.0" x2="734.4" y2="89.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="81.60000000000001" y1="356.0" x2="734.4" y2="356.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="244.79999999999998" y1="44.5" x2="244.79999999999998" y2="400.5" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="571.1999999999999" y1="44.5" x2="571.1999999999999" y2="400.5" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  
  <!-- Focal center icon -->
  <circle cx="408.0" cy="204.70000000000002" r="62.300000000000004" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
  <circle cx="408.0" cy="204.70000000000002" r="31.150000000000002" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
  <circle cx="408.0" cy="204.70000000000002" r="3" fill="rgba(255,255,255,0.9)"/>

  <!-- Minimal typography -->
  <text x="408.0" y="320.4" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="0.08em" text-anchor="middle" fill="rgba(20, 20, 24, 0.85)" text-transform="uppercase">Atmospheric Volume</text>
  <text x="408.0" y="340.4" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="400" letter-spacing="0.04em" text-anchor="middle" fill="rgba(60, 64, 72, 0.7)">Light Diffusion Element</text>
  
  <!-- Technical camera readout mark -->
  <text x="65.28" y="418.29999999999995" font-family="monospace" font-size="10" fill="rgba(20,20,24,0.45)">ISO 100 · 50mm · ƒ/1.4</text>
  <text x="750.72" y="418.29999999999995" font-family="monospace" font-size="10" text-anchor="end" fill="rgba(20,20,24,0.45)">AR · APERTURE</text>
</svg>