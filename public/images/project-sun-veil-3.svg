<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100">
  <defs>
    <linearGradient id="grad_project-sun-veil-3.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(245, 241, 236)"/>
      <stop offset="100%" stop-color="rgb(225, 216, 205)"/>
    </linearGradient>
    <pattern id="grain_project-sun-veil-3.svg" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="70" cy="40" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="40" cy="80" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="85" cy="85" r="0.5" fill="rgba(0,0,0,0.04)"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad_project-sun-veil-3.svg)"/>
  <rect width="100%" height="100%" fill="url(#grain_project-sun-veil-3.svg)"/>
  
  <!-- Subtle aesthetic camera frame/grid -->
  <line x1="90.0" y1="220.0" x2="810.0" y2="220.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="90.0" y1="880.0" x2="810.0" y2="880.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="270.0" y1="110.0" x2="270.0" y2="990.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="630.0" y1="110.0" x2="630.0" y2="990.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  
  <!-- Focal center icon -->
  <circle cx="450.0" cy="506.0" r="126.00000000000001" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
  <circle cx="450.0" cy="506.0" r="63.00000000000001" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
  <circle cx="450.0" cy="506.0" r="3" fill="rgba(255,255,255,0.9)"/>

  <!-- Minimal typography -->
  <text x="450.0" y="792.0" font-family="Inter, -apple-system, sans-serif" font-size="34" font-weight="600" letter-spacing="0.08em" text-anchor="middle" fill="rgba(20, 20, 24, 0.85)" text-transform="uppercase">Sun Veil — Frame 03</text>
  <text x="450.0" y="832.0" font-family="Inter, -apple-system, sans-serif" font-size="21" font-weight="400" letter-spacing="0.04em" text-anchor="middle" fill="rgba(60, 64, 72, 0.7)">High Summer Series Select</text>
  
  <!-- Technical camera readout mark -->
  <text x="72.0" y="1034.0" font-family="monospace" font-size="18" fill="rgba(20,20,24,0.45)">ISO 100 · 50mm · ƒ/1.4</text>
  <text x="828.0" y="1034.0" font-family="monospace" font-size="18" text-anchor="end" fill="rgba(20,20,24,0.45)">AR · APERTURE</text>
</svg>