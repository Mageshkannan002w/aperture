<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="grad_sky.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(235, 238, 242)"/>
      <stop offset="100%" stop-color="rgb(215, 222, 230)"/>
    </linearGradient>
    <pattern id="grain_sky.svg" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="70" cy="40" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="40" cy="80" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="85" cy="85" r="0.5" fill="rgba(0,0,0,0.04)"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad_sky.svg)"/>
  <rect width="100%" height="100%" fill="url(#grain_sky.svg)"/>
  
  <!-- Subtle aesthetic camera frame/grid -->
  <line x1="120.0" y1="160.0" x2="1080.0" y2="160.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="120.0" y1="640.0" x2="1080.0" y2="640.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="360.0" y1="80.0" x2="360.0" y2="720.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="840.0" y1="80.0" x2="840.0" y2="720.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  
  <!-- Focal center icon -->
  <circle cx="600.0" cy="368.0" r="112.00000000000001" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
  <circle cx="600.0" cy="368.0" r="56.00000000000001" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
  <circle cx="600.0" cy="368.0" r="3" fill="rgba(255,255,255,0.9)"/>

  <!-- Minimal typography -->
  <text x="600.0" y="576.0" font-family="Inter, -apple-system, sans-serif" font-size="30" font-weight="600" letter-spacing="0.08em" text-anchor="middle" fill="rgba(20, 20, 24, 0.85)" text-transform="uppercase">Sky Atmosphere</text>
  <text x="600.0" y="612.0" font-family="Inter, -apple-system, sans-serif" font-size="19" font-weight="400" letter-spacing="0.04em" text-anchor="middle" fill="rgba(60, 64, 72, 0.7)">Horizon & Ambient Tone</text>
  
  <!-- Technical camera readout mark -->
  <text x="96.0" y="752.0" font-family="monospace" font-size="16" fill="rgba(20,20,24,0.45)">ISO 100 · 50mm · ƒ/1.4</text>
  <text x="1104.0" y="752.0" font-family="monospace" font-size="16" text-anchor="end" fill="rgba(20,20,24,0.45)">AR · APERTURE</text>
</svg>