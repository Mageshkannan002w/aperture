<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="grad_intro-2.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(244, 241, 238)"/>
      <stop offset="100%" stop-color="rgb(218, 214, 208)"/>
    </linearGradient>
    <pattern id="grain_intro-2.svg" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="70" cy="40" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="40" cy="80" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="85" cy="85" r="0.5" fill="rgba(0,0,0,0.04)"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad_intro-2.svg)"/>
  <rect width="100%" height="100%" fill="url(#grain_intro-2.svg)"/>
  
  <!-- Subtle aesthetic camera frame/grid -->
  <line x1="60.0" y1="120.0" x2="540.0" y2="120.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="60.0" y1="480.0" x2="540.0" y2="480.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="180.0" y1="60.0" x2="180.0" y2="540.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="420.0" y1="60.0" x2="420.0" y2="540.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  
  <!-- Focal center icon -->
  <circle cx="300.0" cy="276.0" r="84.00000000000001" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
  <circle cx="300.0" cy="276.0" r="42.00000000000001" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
  <circle cx="300.0" cy="276.0" r="3" fill="rgba(255,255,255,0.9)"/>

  <!-- Minimal typography -->
  <text x="300.0" y="432.0" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="600" letter-spacing="0.08em" text-anchor="middle" fill="rgba(20, 20, 24, 0.85)" text-transform="uppercase">Detail Study</text>
  <text x="300.0" y="459.0" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="400" letter-spacing="0.04em" text-anchor="middle" fill="rgba(60, 64, 72, 0.7)">Fabric & Surface Line</text>
  
  <!-- Technical camera readout mark -->
  <text x="48.0" y="564.0" font-family="monospace" font-size="12" fill="rgba(20,20,24,0.45)">ISO 100 · 50mm · ƒ/1.4</text>
  <text x="552.0" y="564.0" font-family="monospace" font-size="12" text-anchor="end" fill="rgba(20,20,24,0.45)">AR · APERTURE</text>
</svg>