<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad_client-avatar-1.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(240, 236, 242)"/>
      <stop offset="100%" stop-color="rgb(212, 206, 216)"/>
    </linearGradient>
    <pattern id="grain_client-avatar-1.svg" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="70" cy="40" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="40" cy="80" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="85" cy="85" r="0.5" fill="rgba(0,0,0,0.04)"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad_client-avatar-1.svg)"/>
  <rect width="100%" height="100%" fill="url(#grain_client-avatar-1.svg)"/>
  
  <!-- Subtle aesthetic camera frame/grid -->
  <line x1="20.0" y1="40.0" x2="180.0" y2="40.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="20.0" y1="160.0" x2="180.0" y2="160.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="60.0" y1="20.0" x2="60.0" y2="180.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="140.0" y1="20.0" x2="140.0" y2="180.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  
  <!-- Focal center icon -->
  <circle cx="100.0" cy="92.0" r="28.000000000000004" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
  <circle cx="100.0" cy="92.0" r="14.000000000000002" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
  <circle cx="100.0" cy="92.0" r="3" fill="rgba(255,255,255,0.9)"/>

  <!-- Minimal typography -->
  <text x="100.0" y="144.0" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="0.08em" text-anchor="middle" fill="rgba(20, 20, 24, 0.85)" text-transform="uppercase">Mira Calvet</text>
  <text x="100.0" y="160.0" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="400" letter-spacing="0.04em" text-anchor="middle" fill="rgba(60, 64, 72, 0.7)">Aster Magazine</text>
  
  <!-- Technical camera readout mark -->
  <text x="16.0" y="188.0" font-family="monospace" font-size="10" fill="rgba(20,20,24,0.45)">ISO 100 · 50mm · ƒ/1.4</text>
  <text x="184.0" y="188.0" font-family="monospace" font-size="10" text-anchor="end" fill="rgba(20,20,24,0.45)">AR · APERTURE</text>
</svg>