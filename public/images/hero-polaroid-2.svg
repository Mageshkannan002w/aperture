<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="grad_hero-polaroid-2.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(235, 238, 242)"/>
      <stop offset="100%" stop-color="rgb(208, 215, 224)"/>
    </linearGradient>
    <pattern id="grain_hero-polaroid-2.svg" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="70" cy="40" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="40" cy="80" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="85" cy="85" r="0.5" fill="rgba(0,0,0,0.04)"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad_hero-polaroid-2.svg)"/>
  <rect width="100%" height="100%" fill="url(#grain_hero-polaroid-2.svg)"/>
  
  <!-- Subtle aesthetic camera frame/grid -->
  <line x1="40.0" y1="100.0" x2="360.0" y2="100.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="40.0" y1="400.0" x2="360.0" y2="400.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="120.0" y1="50.0" x2="120.0" y2="450.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="280.0" y1="50.0" x2="280.0" y2="450.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  
  <!-- Focal center icon -->
  <circle cx="200.0" cy="230.0" r="56.00000000000001" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
  <circle cx="200.0" cy="230.0" r="28.000000000000004" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
  <circle cx="200.0" cy="230.0" r="3" fill="rgba(255,255,255,0.9)"/>

  <!-- Minimal typography -->
  <text x="200.0" y="360.0" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="600" letter-spacing="0.08em" text-anchor="middle" fill="rgba(20, 20, 24, 0.85)" text-transform="uppercase">Frame 02</text>
  <text x="200.0" y="378.0" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="400" letter-spacing="0.04em" text-anchor="middle" fill="rgba(60, 64, 72, 0.7)">Studio Study Collection</text>
  
  <!-- Technical camera readout mark -->
  <text x="32.0" y="470.0" font-family="monospace" font-size="10" fill="rgba(20,20,24,0.45)">ISO 100 · 50mm · ƒ/1.4</text>
  <text x="368.0" y="470.0" font-family="monospace" font-size="10" text-anchor="end" fill="rgba(20,20,24,0.45)">AR · APERTURE</text>
</svg>