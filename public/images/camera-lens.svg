<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <linearGradient id="grad_camera-lens.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(236, 238, 242)"/>
      <stop offset="100%" stop-color="rgb(208, 212, 218)"/>
    </linearGradient>
    <pattern id="grain_camera-lens.svg" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="70" cy="40" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="40" cy="80" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="85" cy="85" r="0.5" fill="rgba(0,0,0,0.04)"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad_camera-lens.svg)"/>
  <rect width="100%" height="100%" fill="url(#grain_camera-lens.svg)"/>
  
  <!-- Subtle aesthetic camera frame/grid -->
  <line x1="60.0" y1="100.0" x2="540.0" y2="100.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="60.0" y1="400.0" x2="540.0" y2="400.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="180.0" y1="50.0" x2="180.0" y2="450.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="420.0" y1="50.0" x2="420.0" y2="450.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  
  <!-- Focal center icon -->
  <circle cx="300.0" cy="230.0" r="70.0" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
  <circle cx="300.0" cy="230.0" r="35.0" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
  <circle cx="300.0" cy="230.0" r="3" fill="rgba(255,255,255,0.9)"/>

  <!-- Minimal typography -->
  <text x="300.0" y="360.0" font-family="Inter, -apple-system, sans-serif" font-size="19" font-weight="600" letter-spacing="0.08em" text-anchor="middle" fill="rgba(20, 20, 24, 0.85)" text-transform="uppercase">Optical Precision</text>
  <text x="300.0" y="382.0" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" letter-spacing="0.04em" text-anchor="middle" fill="rgba(60, 64, 72, 0.7)">Shot with Prime Glass</text>
  
  <!-- Technical camera readout mark -->
  <text x="48.0" y="470.0" font-family="monospace" font-size="10" fill="rgba(20,20,24,0.45)">ISO 100 · 50mm · ƒ/1.4</text>
  <text x="552.0" y="470.0" font-family="monospace" font-size="10" text-anchor="end" fill="rgba(20,20,24,0.45)">AR · APERTURE</text>
</svg>