<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="500" height="380">
  <defs>
    <linearGradient id="grad_service-fashion.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(240, 238, 242)"/>
      <stop offset="100%" stop-color="rgb(214, 210, 218)"/>
    </linearGradient>
    <pattern id="grain_service-fashion.svg" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="70" cy="40" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="40" cy="80" r="0.5" fill="rgba(0,0,0,0.04)"/>
      <circle cx="85" cy="85" r="0.5" fill="rgba(0,0,0,0.04)"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad_service-fashion.svg)"/>
  <rect width="100%" height="100%" fill="url(#grain_service-fashion.svg)"/>
  
  <!-- Subtle aesthetic camera frame/grid -->
  <line x1="50.0" y1="76.0" x2="450.0" y2="76.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="50.0" y1="304.0" x2="450.0" y2="304.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="150.0" y1="38.0" x2="150.0" y2="342.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="350.0" y1="38.0" x2="350.0" y2="342.0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  
  <!-- Focal center icon -->
  <circle cx="250.0" cy="174.8" r="53.2" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
  <circle cx="250.0" cy="174.8" r="26.6" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
  <circle cx="250.0" cy="174.8" r="3" fill="rgba(255,255,255,0.9)"/>

  <!-- Minimal typography -->
  <text x="250.0" y="273.59999999999997" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="0.08em" text-anchor="middle" fill="rgba(20, 20, 24, 0.85)" text-transform="uppercase">Fashion & Editorial</text>
  <text x="250.0" y="290.59999999999997" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="400" letter-spacing="0.04em" text-anchor="middle" fill="rgba(60, 64, 72, 0.7)">Magazines & Lookbooks</text>
  
  <!-- Technical camera readout mark -->
  <text x="40.0" y="357.2" font-family="monospace" font-size="10" fill="rgba(20,20,24,0.45)">ISO 100 · 50mm · ƒ/1.4</text>
  <text x="460.0" y="357.2" font-family="monospace" font-size="10" text-anchor="end" fill="rgba(20,20,24,0.45)">AR · APERTURE</text>
</svg>